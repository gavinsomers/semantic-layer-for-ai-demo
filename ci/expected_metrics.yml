# Metric regression test on frozen data (guide chapter 6).
#
# The seeds in dbt/seeds/ are frozen, so every governed metric has one right
# answer for each request below. `sl regress` (and tests/test_metric_regression.py)
# asks the semantic layer for each and compares. A formula, filter or join
# change that moves any of these numbers fails CI, even if the YAML still
# parses and every dbt test passes.
#
# The first block is the book's Friday review (never change those figures).
# The rest are synthetic and were recorded from this warehouse on 2 October 2026.

expected:

  - id: friday_contribution_paid_rule
    metric: contribution_after_ads
    group_by: [product_group]
    filters: {channel: paid_search}
    start: "2026-08-31"
    end: "2026-09-03"
    cutoff: friday_review
    total: 50
    values: {furniture: 120, lighting: -70}

  - id: friday_contribution_approved_rule
