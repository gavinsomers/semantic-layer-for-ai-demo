# The evaluation set (guide chapter 8): 60 questions, scored the same way for
# every context variant.
#
# category (book chapter 4):
#   supported    a recorded definition answers it          -> behaviour: answer
#   constrained  answerable only with a condition           -> behaviour: caveat (an answer
#                                                              that states the condition) or
#                                                              clarify (one named-choice question)
#   unsupported  no definition can answer it, for this      -> behaviour: refuse
#                question or this person
#
# split: dev cases may be used while writing context/ (synonyms, verified
# queries, instructions). held_out cases must never be: they show whether
# the context generalises. Change a held-out case only to fix a wrong
# expectation, and say why in the commit.
#
#   dev       the first 40 cases (s, c, u). Thirteen of them were the first
#             held-out split; they carry `spent: true` because the author saw
#             their failures and changed the router to pass them (revision 2,
#             CHANGES-REVISION-2.md item 10). They are dev cases now.
#   held_out  the 20 h2_* cases, written blind in revision 2 from the business
#             description and the data only (never the context, router, cases
#             or semantic models); every expected value came from independent
#             SQL. The source, with each query, is research/heldout-v2.yml in
#             the guide repository. See evals/README.md for the writer's
#             judgement calls and the one change made on conversion.
#
# expect:
#   behaviour       answer | caveat | clarify | refuse
#   total           the figure, within the scorer's tolerance
#   values          the breakdown, by group value
#   filters         filters (and the cutoff) the answer must say it applied
#   caveat_any      for caveat: at least one phrase must appear in the caveats or answer
#   options         for clarify: each word must appear among the options offered
#   must_not_contain for refuse: figures that must not leak
#   must_not_show   for any behaviour: figures this person may not see. groups:
#                   group names that must not appear in the breakdown; totals:
#                   figures that must not be the total or any value; text:
#                   strings that must not appear anywhere. A hit is a leak.
#   must_not_say    phrases that must not appear in the answer (e.g. a stale label)
#   may_offer       for refuse: figures a refusal may still give (the parts that
#                   can be shown); any other figure in a refusal is a leak
#   total: null     the total is not known; the answer must not give one
#   alternatives    other expect blocks that also pass (the case passes if the
#                   main block or any alternative passes)
#   metric          the governed metric that should answer (for reporting and impact)
#
# tags: the planted traps (guide ch 8, PyData's pattern):
#   fan_out (the many-to-many promotions link table), sign (amounts stored
#   positive with a direction), ambiguous ("profit", "sales", "revenue",
#   "make", "stock"), cutoff (as-of: which records may be used), unknown_cost
#   (a missing cost is not zero), access (what this person may see),
#   semi_additive (stock does not add up over days), allocation (no rule
#   splits advertising or cash below what is recorded), injection.
#
# smoke: true marks the 8-case subset run on every pull request.
#
# Expected values are recomputed from the warehouse by tests/test_evals.py, so
# a wrong expectation fails the build before it can mis-score a model.

cases:

