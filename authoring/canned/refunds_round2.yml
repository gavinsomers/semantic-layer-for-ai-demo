# CANNED DRAFT, round 2 (offline mode of `sl draft`): round 1 fixed after the
# sample-question gate failed. One primary entity at the mart's grain
# (snapshot_key: one refund at one cutoff) and the cutoff entity, so every
# query can be limited to one cutoff. dbt's latest YAML spec: the semantic
# model sits on the mart's own entry, beside its column tests.
models:
  - name: fct_refunds
    description: >
      One row per refund at one named cutoff, in the state it had reached by
      then. Always filter to one cutoff.
    semantic_model:
      enabled: true
      name: refunds
    agg_time_dimension: refund_accepted_date
    columns:
      - name: snapshot_key
        data_tests: [unique, not_null]
        entity: {type: primary, name: refund_snapshot}
      - name: order_id
        entity: {type: foreign, name: order}
      - name: channel
        entity: {type: foreign, name: channel}
      - name: product_group
        entity: {type: foreign, name: product_group}
      - name: cutoff_id
        entity: {type: foreign, name: cutoff}
      - name: accepted_date
        granularity: day
        dimension: {type: time, name: refund_accepted_date}
      - name: refund_state
        dimension: {type: categorical}
        data_tests:
          - accepted_values:
              arguments:
                values: [requested, approved, paid]

    metrics:
      - name: refunds_outstanding
        label: Refunds approved but not yet paid
        description: >
          Unit: GBP, a positive number. Grain: refund. Refunds approved by the
          cutoff and not yet paid by it, for the selected orders. Not for: refunds
          paid (use refunds_paid) or cash (use cash_received).
        type: simple
        agg: sum
        expr: amount_outstanding
        config:
          meta:
            owner: finance lead
            approver: head of data
            status: draft
            version: 1
            last_reviewed: null              # set when a person approves the draft
            unit: GBP

      - name: refunds_approved
        label: Refunds approved (paid or not)
        description: >
          Unit: GBP, a positive number. Grain: refund. Refunds approved by the
          cutoff, whether paid yet or not; each refund once. Not for: the rule in
          force for contribution (the paid-refund rule) or cash refunded.
        type: simple
        agg: sum
        expr: amount_approved
        config:
          meta:
            owner: finance lead
            approver: head of data
            status: draft
            version: 1
            last_reviewed: null              # set when a person approves the draft
            unit: GBP
